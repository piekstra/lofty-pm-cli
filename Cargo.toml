[package]
name = "lofty-pm-cli"
version = "0.2.0"
edition = "2021"
# pk-cli-auth (cli-common v0.21.0) needs 1.89.
rust-version = "1.89"
description = "Agent-first Lofty governance assistant: email-driven vote monitoring, stance-aware recommendations, auditable decisions."
license = "MIT"
repository = "https://github.com/piekstra/lofty-pm-cli"
readme = "README.md"

[[bin]]
name = "lofty-pm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0" }
# `lofty-pm mcp`: read-only tools for Claude over stdio or 127.0.0.1 (DESIGN.md §1.9).
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0", features = ["stdio", "http"] }
schemars = "1"

[dev-dependencies]
# The MCP profile's conformance checks, for the tests only.
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
