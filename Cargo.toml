[package]
name = "lofty-pm-cli"
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
description = "Agent-first Lofty governance assistant: email-driven vote monitoring, stance-aware recommendations, auditable decisions."
license = "MIT"
repository = "https://github.com/piekstra/lofty-pm-cli"
readme = "README.md"

[[bin]]
name = "lofty-pm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.15.1" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.15.1" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.15.1" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.15.1" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
